name: Ejecutar proyecto PCH

# Se ejecuta con cada cambio en main o a mano desde la pestaña Actions ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ejecutar-proyecto
  cancel-in-progress: true

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar librerías
        run: python -m pip install -r requirements.txt

      - name: Crear la base de datos SQL desde data/
        run: python base_datos/crear_base_datos.py

      - name: Ejecutar el cuaderno completo (TRM del día en línea)
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/PCH_Proyecto_Integrado.ipynb --ExecutePreprocessor.timeout=1800

      - name: Generar el README y la aplicación web
        run: |
          python scripts/generar_readme.py
          python scripts/construir_app.py

      - name: Guardar los resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md notebooks/ resultados/ base_datos/
          git diff --cached --quiet || git commit -m "Resultados actualizados ($(date -u +%Y-%m-%d))"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar-app:
    # Requiere activar una vez: Settings → Pages → Source: GitHub Actions.
    needs: ejecutar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
